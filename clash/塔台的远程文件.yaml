# ==========================================================
# 塔台 / ShellClash —— 当前保存版修正版
#
# 本次修改：
# 1. rule-providers 中所有 .list 规则统一使用：
#      behavior: classical
#      format: text
# 2. 补齐“谷歌搜索”的 rule-provider 模板。
# 3. 在 rules 中补齐：
#      RULE-SET,谷歌搜索,谷歌搜索
# 4. 谷歌搜索规则地址暂留占位，后续手动填写。
# ==========================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
ipv6: true
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - +.local
  - +.localdomain
  - +.miwifi.com
  - router.miwifi.com
  - '*.plex.direct'
  - +.msftconnecttest.com
  - +.msftncsi.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
proxies: []
proxy-groups:
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all: true
- name: 🔯 故障转移
  type: fallback
  include-all: true
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  include-all: true
  strategy: consistent-hashing
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🚀 节点选择
  type: select
  include-all: true
  proxies:
  - 🚀 手动切换
