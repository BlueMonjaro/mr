# ==========================================================
# Tower / 塔台专用 RuleScheme
#
# 目标：
# - 每个原本 include-all: true 的业务/基础策略组，直接包含全部实际节点
# - 地区策略组继续只包含对应地区节点
# - 保留原有策略组引用、规则顺序、rule-provider URL
#
# Tower 导入机制：
#   use: 下存在列表项 -> usesProvider = true
#   filter: .*            -> nodePattern(".*") -> 匹配全部节点
#
# 注意：
# - 这是用于“塔台 -> 导入规则链接”的规则方案，不是 ShellClash 主配置。
# - __TOWER_ALL_NODES__ 只是触发 Tower usesProvider 的占位名称，
#   Tower 的 RuleSchemeParser 不会按名称解析真实 proxy-provider。
# ==========================================================

proxy-groups:
